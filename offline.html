<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#287FC1">
  <title>SymptoSense — لا يوجد اتصال</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7FAFC; color: #163B5C; }
    main { width: min(460px, 100%); text-align: center; background: #fff; border: 1px solid #DCE8F0; border-radius: 20px; padding: 34px 24px; box-shadow: 0 8px 24px rgba(31,86,127,.08); }
    img { width: 92px; height: 92px; border-radius: 24px; }
    h1 { margin: 18px 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; line-height: 1.8; color: #607487; }
    button { border: 0; border-radius: 12px; padding: 13px 20px; background: #287FC1; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    small { display: block; margin-top: 20px; color: #607487; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="SymptoSense">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك ثم حاول مرة أخرى. لحمايتك، لا نخزّن صفحاتك أو معلوماتك الصحية الخاصة للاستخدام دون إنترنت.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <small>SymptoSense V2 — للتوعية الصحية فقط</small>
  </main>
</body>
</html>
