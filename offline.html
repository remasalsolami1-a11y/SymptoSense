<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1976D2">
  <title>SymptoSense — لا يوجد اتصال</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F9FF; color: #123B70; }
    main { width: min(460px, 100%); text-align: center; background: #fff; border: 1px solid #DCEBFA; border-radius: 24px; padding: 34px 24px; box-shadow: 0 18px 48px rgba(18,59,112,.12); }
    img { width: 92px; height: 92px; border-radius: 24px; }
    h1 { margin: 18px 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; line-height: 1.8; color: #40566F; }
    button { border: 0; border-radius: 13px; padding: 13px 20px; background: #1976D2; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    small { display: block; margin-top: 20px; color: #718096; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="SymptoSense">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحققي من اتصالك ثم حاولي مرة أخرى. لحمايتك، لا نخزّن صفحاتك أو معلوماتك الصحية الخاصة للاستخدام دون إنترنت.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <small>SymptoSense — للتوعية الصحية فقط</small>
  </main>
</body>
</html>
