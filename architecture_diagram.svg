<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SymptoSense architecture</title>
  <desc id="desc">Users and administrators access a Flask web application that connects authentication, symptom analysis, search, medications, the medical knowledge base, and the database.</desc>
  <rect width="1200" height="620" fill="#f7fbfe"/>
  <style>
    .box{fill:#fff;stroke:#bddaea;stroke-width:2}.primary{fill:#eaf5fc;stroke:#6aadd5}.admin{fill:#f3f7fa;stroke:#94aabd}
    .t{font:700 23px Arial,sans-serif;fill:#163b5c;text-anchor:middle}.s{font:400 16px Arial,sans-serif;fill:#486581;text-anchor:middle}
    .line{fill:none;stroke:#6aadd5;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6aadd5"/></marker></defs>
  <rect class="box" x="55" y="245" width="190" height="105" rx="20"/><text class="t" x="150" y="288">User</text><text class="s" x="150" y="318">Web / PWA</text>
  <rect class="primary" x="350" y="225" width="250" height="145" rx="24"/><text class="t" x="475" y="282">Flask Web App</text><text class="s" x="475" y="317">Routes · UI · APIs</text>
  <path class="line" d="M245 297H350"/>
  <rect class="box" x="710" y="50" width="210" height="100" rx="20"/><text class="t" x="815" y="92">Authentication</text><text class="s" x="815" y="122">Sessions · Email</text>
  <rect class="box" x="710" y="185" width="210" height="100" rx="20"/><text class="t" x="815" y="227">Symptom Analysis</text><text class="s" x="815" y="257">Safety · Explanation</text>
  <rect class="box" x="710" y="320" width="210" height="100" rx="20"/><text class="t" x="815" y="362">Search &amp; Meds</text><text class="s" x="815" y="392">Information · Reminders</text>
  <path class="line" d="M600 270C650 270 655 100 710 100"/><path class="line" d="M600 290H710"/><path class="line" d="M600 325C650 325 655 370 710 370"/>
  <rect class="primary" x="990" y="180" width="170" height="105" rx="20"/><text class="t" x="1075" y="222">Medical</text><text class="t" x="1075" y="250">Knowledge Base</text>
  <rect class="primary" x="990" y="330" width="170" height="105" rx="20"/><text class="t" x="1075" y="372">Database</text><text class="s" x="1075" y="402">PostgreSQL / SQLite</text>
  <path class="line" d="M920 235H990"/><path class="line" d="M920 370H990"/><path class="line" d="M1075 285V330"/>
  <rect class="admin" x="350" y="470" width="250" height="100" rx="20"/><text class="t" x="475" y="512">Admin</text><text class="s" x="475" y="542">Protected page &amp; APIs</text>
  <path class="line" d="M475 470V370"/><path class="line" d="M600 520C820 520 900 435 990 400"/>
</svg>
