name: SymptoSense CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Translation quality gate
        run: python tools/check_translations.py
      - name: Dependency-light release checks
        run: python tools/release_check.py
      - name: CSP interaction bridge behavior
        run: node tools/test_interaction_bridge.js
      - name: Clinical sign-off status (set RELEASE_STRICT_SIGNOFF=1 on release branches to block while pending)
        run: python tools/signoff.py check ${{ vars.RELEASE_STRICT_SIGNOFF == '1' && '--strict' || '' }}
      - name: Full test suite
        env:
          WEB_SECRET: ci-only-secret-that-is-longer-than-32-characters
          DATABASE_URL: ""
          SESSION_COOKIE_SECURE: "0"
        run: python -m pytest -q tests
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application + browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install
          npx playwright install --with-deps chromium
      - name: Start local release candidate
        env:
          WEB_SECRET: ci-browser-secret-that-is-longer-than-32-characters
          SESSION_COOKIE_SECURE: "0"
          PORT: "5000"
          SYMPTOSENSE_DISABLE_BACKUP_SCHEDULER: "1"
        run: |
          python webapp.py > /tmp/symptosense-e2e.log 2>&1 &
          echo $! > /tmp/symptosense-e2e.pid
          python - <<'PYWAIT'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=1) as r:
                      if r.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('server did not become ready')
          PYWAIT
      - name: Responsive browser E2E matrix
        run: python tools/e2e_browser.py --base-url http://127.0.0.1:5000
      - name: Full-flow browser test (fails on any JS error or serious WCAG violation)
        run: |
          python -m pip install axe-playwright-python
          python tools/e2e_full_flow.py --base-url http://127.0.0.1:5000
          python tools/e2e_emergency_stop.py --base-url http://127.0.0.1:5000
      - name: Automated WCAG accessibility audit
        env:
          E2E_BASE_URL: http://127.0.0.1:5000
        run: npm run test:a11y
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/symptosense-e2e.log || true

